<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GLB 交互描边查看器</title>
  <style>
    html,body{margin:0;height:100%;background:#f5f5f5;}
    #app{position:fixed;inset:0;}
    .panel{
      position:fixed; top:12px; right:12px; padding:10px 12px; border-radius:12px;
      background:rgba(255,255,255,.9); font:14px/1.4 system-ui,Segoe UI,Roboto;
      box-shadow:0 6px 30px rgba(0,0,0,.08); backdrop-filter:saturate(1.2) blur(8px); z-index:10;
    }
    .panel label{display:flex;align-items:center;gap:8px;margin:6px 0;}
    .panel input[type="color"]{width:32px;height:20px;border:none;background:none;padding:0}
    .panel input[type="range"]{width:140px}
    .badge{position:fixed;left:12px;bottom:12px;font:12px system-ui;color:#666}
    .log{position:fixed;left:12px;top:12px;max-width:60vw;background:rgba(0,0,0,.6);color:#fff;
      font:12px/1.4 ui-monospace,monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;z-index:10}
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 控制面板 -->
  <div class="panel">
    <label><input id="toggleOutline" type="checkbox" checked> 启用描边</label>
    <label>颜色 <input id="color" type="color" value="#000000"></label>
    <label>粗细 <input id="thickness" type="range" min="1" max="6" step="0.1" value="2"></label>
    <label>强度 <input id="strength" type="range" min="0" max="10" step="0.1" value="3"></label>
    <label><input id="autorotate" type="checkbox" checked> 自动旋转</label>
    <div style="margin-top:6px;color:#888">提示：鼠标悬停/点击可高亮部件</div>
  </div>
  <div class="badge">three.js + OutlinePass</div>
  <div class="log" id="log">日志：</div>

  <!-- 使用非模块版（全局 THREE.*），避免浏览器无法解析 ESModule import -->
  <!-- 锁定版本到 0.152.2（稳定），以后需要可改为更高版本但注意兼容性 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/postprocessing/OutlinePass.js"></script>

  <script>
    // ========= 1) 改成你的 GLB 路径 =========
    // 与 viewer.html 同目录：用相对路径 "./stage.glb"
    // 如果放国内 OSS/CDN：改成它的 https 直链
    const GLB_URL = "./stage.glb"; // 可加 ?v=时间戳 刷新缓存，例如 "./stage.glb?v=20250817"

    // 日志工具
    const LOG = document.getElementById('log');
    const log = (...args)=>{ LOG.textContent += '\n' + args.join(' '); console.log(...args); };

    // ========= 2) 基础场景 =========
    const container = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f5f5f5');

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 6);

    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(2, 4, 2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6), light1);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    // 可视化辅助：坐标轴/网格，证明渲染正常
    const axes = new THREE.AxesHelper(1.2);
    const grid = new THREE.GridHelper(10, 10, 0x888888, 0xdddddd);
    grid.position.y = -0.01;
    scene.add(axes, grid);

    // ========= 3) 后处理：Outline =========
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    const outlinePass = new THREE.OutlinePass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      scene, camera
    );
    outlinePass.edgeStrength = 3.0;      // 强度
    outlinePass.edgeThickness = 2.0;     // 粗细（像素）
    outlinePass.edgeGlow = 0.0;
    outlinePass.usePatternTexture = false;
    outlinePass.visibleEdgeColor.set('#000000');
    outlinePass.hiddenEdgeColor.set('#000000');
    composer.addPass(outlinePass);

    // ========= 4) 加载 GLB =========
    const loader = new THREE.GLTFLoader();
    const selectable = []; // 可被描边/选中的网格
    loader.load(GLB_URL, (gltf) => {
      log('✅ 模型加载完成：', GLB_URL);
      const root = gltf.scene;
      root.traverse(o => {
        if (o.isMesh) { o.castShadow = o.receiveShadow = true; selectable.push(o); }
      });
      scene.add(root);
      fitCameraToObject(camera, root, controls);
      outlinePass.selectedObjects = selectable.length ? selectable : [root];
    }, (evt) => {
      if (evt.total) {
        const p = (evt.loaded/evt.total*100).toFixed(1);
        LOG.textContent = `加载中：${p}%\n` + LOG.textContent.split('\n').slice(1).join('\n');
      } else {
        log('加载中：', evt.loaded, 'bytes');
      }
    }, (err) => {
      log('❌ 模型加载失败：', err && (err.message || err));
      // 兜底：显示一个方块，证明渲染没问题
      const mat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness:0, roughness:1 });
      const cube = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
      scene.add(cube);
      fitCameraToObject(camera, cube, controls);
    });

    // ========= 5) 悬停/点击高亮 =========
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null;
    let clicked = null;

    function onPointerMove(event){
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      if (!selectable.length) return;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(selectable, true);
      hovered = hits[0]?.object || null;
      updateSelection();
    }
    function onClick(){
      if (!selectable.length) return;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(selectable, true);
      clicked = hits[0]?.object || null;
      updateSelection(true);
    }
    function updateSelection(byClick=false){
      if (byClick && clicked) outlinePass.selectedObjects = [clicked];
      else if (!clicked && hovered) outlinePass.selectedObjects = [hovered];
      else if (!clicked && !hovered) outlinePass.selectedObjects = selectable.length?selectable:[];
    }
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('click', onClick);

    // ========= 6) 自适应 =========
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      outlinePass.setSize(w, h);
    });

    // ========= 7) 面板绑定 =========
    const $ = (id)=>document.getElementById(id);
    $('#toggleOutline').addEventListener('change', e=> outlinePass.enabled = e.target.checked);
    $('#color').addEventListener('input', e=>{
      outlinePass.visibleEdgeColor.set(e.target.value);
      outlinePass.hiddenEdgeColor.set(e.target.value);
    });
    $('#thickness').addEventListener('input', e=> outlinePass.edgeThickness = parseFloat(e.target.value));
    $('#strength').addEventListener('input', e=> outlinePass.edgeStrength = parseFloat(e.target.value));
    $('#autorotate').addEventListener('change', e=> controls.autoRotate = e.target.checked);

    // ========= 8) 动画循环 =========
    function animate(){ requestAnimationFrame(animate); controls.update(); composer.render(); }
    animate();

    // 视角适配
    function fitCameraToObject(camera, object, controls) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3(); box.getSize(size);
      const center = new THREE.Vector3(); box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const fov = camera.fov * (Math.PI/180);
      let cameraZ = Math.abs(maxDim / (2 * Math.tan(fov/2))); cameraZ *= 1.3;
      camera.position.set(center.x, center.y + maxDim*0.1, cameraZ);
      camera.lookAt(center); controls.target.copy(center); controls.update();
      log('📐 bbox=', size.toArray().map(n=>n.toFixed(2)).join(','), ' center=', center.toArray().map(n=>n.toFixed(2)).join(','));
    }
  </script>
</body>
</html>
