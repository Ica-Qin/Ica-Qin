<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GLB 交互描边查看器 (three r152 ESM)</title>
  <style>
    html,body{margin:0;height:100%;background:#f5f5f5;}
    #app{position:fixed;inset:0;}
    .panel{
      position:fixed; top:12px; right:12px; padding:12px; border-radius:12px;
      background:rgba(255,255,255,.92); font:13px/1.4 system-ui,Segoe UI,Roboto;
      box-shadow:0 6px 30px rgba(0,0,0,.08); backdrop-filter:saturate(1.2) blur(8px); z-index:10;
      max-width: 300px;
    }
    .panel .row{display:flex; align-items:center; gap:8px; margin:6px 0;}
    .panel .row > span{min-width:72px; color:#333}
    .panel input[type="color"]{width:32px;height:20px;border:none;background:none;padding:0}
    .panel input[type="range"]{width:150px}
    .panel input[type="number"]{width:84px}
    .panel .sub{color:#888; margin-top:6px}
    .badge{position:fixed;left:12px;bottom:12px;font:12px system-ui;color:#666}
    .log{position:fixed;left:12px;top:12px;max-width:60vw;background:rgba(0,0,0,.65);color:#fff;
      font:12px/1.4 ui-monospace,monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;z-index:10}
    button{border:1px solid #ddd; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer}
    button:active{transform:translateY(1px)}
  </style>

  <!-- Import map: 把裸模块名 "three" 映射到本地 -->
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three-r152/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div class="panel">
    <div class="row"><label><input id="toggleOutline" type="checkbox" checked> 启用描边</label></div>
    <div class="row"><span>颜色</span><input id="color" type="color" value="#000000"></div>
    <div class="row"><span>粗细</span><input id="thickness" type="range" min="1" max="6" step="0.1" value="2"><output id="thicknessOut">2</output></div>
    <div class="row"><span>强度</span><input id="strength" type="range" min="0" max="10" step="0.1" value="3"><output id="strengthOut">3</output></div>
    <hr>

    <div class="row"><span>FOV</span><input id="fov" type="range" min="20" max="90" step="1" value="40"><output id="fovOut">40</output></div>
    <div class="row"><span>视距裕量</span><input id="ratio" type="range" min="1.05" max="2.5" step="0.01" value="1.35"><output id="ratioOut">1.35</output></div>

    <div class="row"><label><input id="autoRange" type="checkbox" checked> 自动相机范围</label></div>
    <div class="row"><span>近裁剪</span><input id="near" type="range" min="0.01" max="50" step="0.01" value="0.1" disabled><output id="nearOut">0.10</output></div>
    <div class="row"><span>远裁剪</span><input id="far" type="range" min="10" max="10000" step="1" value="2000" disabled><output id="farOut">2000</output></div>
    <div class="row"><button id="refit">重新适配视角</button></div>

    <hr>
    <div class="row"><span>背景</span><input id="bg" type="color" value="#f5f5f5"></div>
    <div class="row"><span>灯光</span><input id="light" type="range" min="0" max="3" step="0.05" value="1.2"><output id="lightOut">1.2</output></div>
    <div class="row"><label><input id="autorotate" type="checkbox" checked> 自动旋转</label></div>
    <div class="row"><span>自转速度</span><input id="rotateSpeed" type="range" min="0" max="2" step="0.05" value="0.6"><output id="rotateOut">0.6</output></div>

    <div class="row"><label><input id="gridVis" type="checkbox" checked> 显示网格</label></div>
    <div class="row"><span>网格缩放</span><input id="gridScale" type="range" min="0.1" max="5" step="0.05" value="1"><output id="gridScaleOut">1.00</output></div>

    <div class="sub">提示：鼠标悬停/点击可高亮部件</div>
  </div>

  <div class="badge">three r152 (ESM) + OutlinePass</div>
  <div class="log" id="log">日志：</div>

  <script type="module">
    import * as THREE from './libs/three-r152/build/three.module.js';
    import { OrbitControls } from './libs/three-r152/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from './libs/three-r152/examples/jsm/loaders/GLTFLoader.js';
    import { EffectComposer } from './libs/three-r152/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from './libs/three-r152/examples/jsm/postprocessing/RenderPass.js';
    import { OutlinePass } from './libs/three-r152/examples/jsm/postprocessing/OutlinePass.js';

    // 与 viewer.html 同目录
    const GLB_URL = './stage.glb?v=1';

    const $ = (id)=>document.getElementById(id);
    const LOG = $('#log');
    const log = (...args)=>{ LOG.textContent = `加载中： ${progressText}\n` + args.join(' ') + '\n' + LOG.textContent.split('\n').slice(2).join('\n'); console.log(...args); };
    let progressText = '—';

    // ===== 基础场景 =====
    const container = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding; // r152
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color($('#bg').value);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.set(0, 2, 6);

    const light1 = new THREE.DirectionalLight(0xffffff, parseFloat($('#light').value));
    light1.position.set(2, 4, 2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6), light1);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = parseFloat($('#rotateSpeed').value);

    // 可视化辅助
    const axes = new THREE.AxesHelper(1.2);
    const grid = new THREE.GridHelper(10, 10, 0x888888, 0xdddddd);
    grid.position.y = -0.01;
    scene.add(axes, grid);

    // ===== 后处理：Outline =====
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
    outlinePass.edgeStrength = parseFloat($('#strength').value);
    outlinePass.edgeThickness = parseFloat($('#thickness').value);
    outlinePass.edgeGlow = 0.0;
    outlinePass.usePatternTexture = false;
    outlinePass.visibleEdgeColor.set($('#color').value);
    outlinePass.hiddenEdgeColor.set($('#color').value);
    composer.addPass(outlinePass);

    // ===== 模型加载 =====
    const loader = new GLTFLoader();
    const selectable = [];
    let bboxSize = new THREE.Vector3(1,1,1);
    let bboxCenter = new THREE.Vector3(0,0,0);
    let maxDim = 1;

    loader.load(GLB_URL, (gltf) => {
      log('✅ 模型加载完成：', GLB_URL);
      const root = gltf.scene;
      root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; selectable.push(o); } });
      scene.add(root);

      // 计算包围盒
      const box = new THREE.Box3().setFromObject(root);
      box.getSize(bboxSize);
      box.getCenter(bboxCenter);
      maxDim = Math.max(bboxSize.x, bboxSize.y, bboxSize.z) || 1;

      refitCamera(); // 初次适配
      outlinePass.selectedObjects = selectable.length ? selectable : [root];

    }, (evt) => {
      if (evt.total) progressText = `${(evt.loaded/evt.total*100).toFixed(1)}%`;
      else progressText = `${evt.loaded} bytes`;
    }, (err) => {
      log('❌ 模型加载失败：', err && (err.message || err));
      // 兜底：显示一个立方体
      const mat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness:0, roughness:1 });
      const cube = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
      scene.add(cube);
      const box = new THREE.Box3().setFromObject(cube);
      box.getSize(bboxSize); box.getCenter(bboxCenter); maxDim = 1;
      refitCamera();
    });

    // ===== 交互高亮 =====
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null, clicked = null;

    function onPointerMove(event){
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      if (!selectable.length) return;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(selectable, true);
      hovered = hits[0]?.object || null;
      updateSelection();
    }
    function onClick(){
      if (!selectable.length) return;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(selectable, true);
      clicked = hits[0]?.object || null;
      updateSelection(true);
    }
    function updateSelection(byClick=false){
      if (byClick && clicked) outlinePass.selectedObjects = [clicked];
      else if (!clicked && hovered) outlinePass.selectedObjects = [hovered];
      else if (!clicked && !hovered) outlinePass.selectedObjects = selectable.length?selectable:[];
    }
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('click', onClick);

    // ===== 相机适配与面板联动 =====
    function refitCamera() {
      // 由 FOV 与 maxDim 计算相机距离
      const fov = camera.fov * Math.PI/180;
      const dist = maxDim / (2 * Math.tan(fov/2));
      const ratio = parseFloat($('#ratio').value);
      const camZ = dist * ratio;

      camera.position.set(bboxCenter.x, bboxCenter.y + maxDim*0.1, camZ);

      if ($('#autoRange').checked) {
        camera.near = Math.max(camZ - maxDim*3, 0.01);
        camera.far  = camZ + maxDim*3;
        $('#near').value = camera.near.toFixed(2);
        $('#far').value  = camera.far.toFixed(0);
        $('#nearOut').textContent = parseFloat($('#near').value).toFixed(2);
        $('#farOut').textContent  = parseFloat($('#far').value).toFixed(0);
      } else {
        camera.near = Math.max(parseFloat($('#near').value), 0.01);
        camera.far  = Math.max(parseFloat($('#far').value), camera.near + 1);
      }

      camera.updateProjectionMatrix();
      controls.target.copy(bboxCenter);
      controls.maxDistance = camera.far * 0.9;
      controls.update();

      // 网格按模型尺度缩放
      grid.visible = $('#gridVis').checked;
      const s = Math.max(maxDim * parseFloat($('#gridScale').value), 0.001);
      grid.scale.setScalar(s / 10); // 原始尺寸10，缩放到与 maxDim 同量级

      log(
        `📐 bbox=${bboxSize.toArray().map(n=>n.toFixed(2)).join(',')}  center=${bboxCenter.toArray().map(n=>n.toFixed(2)).join(',')}`,
        ` camZ=${camZ.toFixed(2)}  near/far=${camera.near.toFixed(2)}/${camera.far.toFixed(2)}`
      );
    }

    // 面板：描边
    $('#toggleOutline').addEventListener('change', e=> outlinePass.enabled = e.target.checked);
    $('#color').addEventListener('input', e=>{
      outlinePass.visibleEdgeColor.set(e.target.value);
      outlinePass.hiddenEdgeColor.set(e.target.value);
    });
    $('#thickness').addEventListener('input', e=>{ outlinePass.edgeThickness = parseFloat(e.target.value); $('#thicknessOut').textContent=e.target.value; });
    $('#strength').addEventListener('input', e=>{ outlinePass.edgeStrength  = parseFloat(e.target.value); $('#strengthOut').textContent=e.target.value; });

    // 面板：相机
    $('#fov').addEventListener('input', e=>{ camera.fov = parseFloat(e.target.value); $('#fovOut').textContent=e.target.value; refitCamera(); });
    $('#ratio').addEventListener('input', e=>{ $('#ratioOut').textContent=e.target.value; refitCamera(); });
    $('#autoRange').addEventListener('change', e=>{
      const on = e.target.checked;
      $('#near').disabled = $('#far').disabled = on;
      refitCamera();
    });
    $('#near').addEventListener('input', e=>{ $('#nearOut').textContent=parseFloat(e.target.value).toFixed(2); if(!$('#autoRange').checked) refitCamera(); });
    $('#far').addEventListener('input', e=>{ $('#farOut').textContent=parseFloat(e.target.value).toFixed(0); if(!$('#autoRange').checked) refitCamera(); });
    $('#refit').addEventListener('click', refitCamera);

    // 面板：场景
    $('#bg').addEventListener('input', e=> scene.background = new THREE.Color(e.target.value));
    $('#light').addEventListener('input', e=>{ light1.intensity = parseFloat(e.target.value); $('#lightOut').textContent=e.target.value; });
    $('#autorotate').addEventListener('change', e=> controls.autoRotate = e.target.checked);
    $('#rotateSpeed').addEventListener('input', e=>{ controls.autoRotateSpeed = parseFloat(e.target.value); $('#rotateOut').textContent=e.target.value; });
    $('#gridVis').addEventListener('change', refitCamera);
    $('#gridScale').addEventListener('input', e=>{ $('#gridScaleOut').textContent=parseFloat(e.target.value).toFixed(2); refitCamera(); });

    // ===== 自适应 =====
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      outlinePass.setSize(w, h);
    });

    // ===== 渲染循环 =====
    function animate(){ requestAnimationFrame(animate); controls.update(); composer.render(); }
    animate();
  </script>
</body>
</html>
