<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GLB 交互描边查看器</title>
  <style>
    html,body{margin:0;height:100%;background:#f5f5f5;}
    #app{position:fixed;inset:0;}
    .panel{
      position:fixed; top:12px; right:12px; padding:10px 12px; border-radius:12px;
      background:rgba(255,255,255,.9); font:14px/1.4 system-ui,Segoe UI,Roboto;
      box-shadow:0 6px 30px rgba(0,0,0,.08); backdrop-filter:saturate(1.2) blur(8px);
    }
    .panel label{display:flex;align-items:center;gap:8px;margin:6px 0;}
    .panel input[type="color"]{width:32px;height:20px;border:none;background:none;padding:0}
    .panel input[type="range"]{width:140px}
    .badge{position:fixed;left:12px;bottom:12px;font:12px system-ui;color:#666}
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 控制面板（可选） -->
  <div class="panel">
    <label><input id="toggleOutline" type="checkbox" checked> 启用描边</label>
    <label>颜色 <input id="color" type="color" value="#000000"></label>
    <label>粗细 <input id="thickness" type="range" min="1" max="6" step="0.1" value="2"></label>
    <label>强度 <input id="strength" type="range" min="0" max="10" step="0.1" value="3"></label>
    <label><input id="autorotate" type="checkbox" checked> 自动旋转</label>
    <div style="margin-top:6px;color:#888">提示：点击模型可高亮该部件</div>
  </div>
  <div class="badge">three.js + OutlinePass</div>

  <script type="module">
    // 使用 three 官方 CDN（稳定、2025 年可用），如需锁版本可把 @0.160.0 固定成你想要的版本
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
    import { OutlinePass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/OutlinePass.js';

    // 1) 基础场景
    const container = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f5f5f5');

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 6);

    const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(2, 4, 2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6), light1);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    // 2) 加载 GLB（把下面 URL 换成你的国内 CDN / OSS 直链）
    const GLB_URL = 'https://cdn.jsdelivr.net/gh/Ica-Qin/Ica-Qin/portfolio_document/stage.glb?v=1'; // TODO: 换成你的
    const loader = new GLTFLoader();

    // 为了能对每个子网格单独描边，确保它们是 Mesh
    let modelRoot = null;
    const selectable = [];  // 可被描边的对象集合
    loader.load(GLB_URL, (gltf) => {
      modelRoot = gltf.scene;
      modelRoot.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = obj.receiveShadow = true;
          selectable.push(obj);
        }
      });
      scene.add(modelRoot);
      fitCameraToObject(camera, modelRoot, controls);
      outlinePass.selectedObjects = selectable; // 默认对整模描边（外轮廓/部件边）
    }, undefined, (e) => {
      console.error('GLB 加载失败：', e);
    });

    // 3) 后处理：OutlinePass
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const size = new THREE.Vector2(window.innerWidth, window.innerHeight);
    const outlinePass = new OutlinePass(size, scene, camera);
    outlinePass.edgeStrength = 3.0;  // 强度
    outlinePass.edgeGlow = 0.0;
    outlinePass.edgeThickness = 2.0; // 粗细（像素）
    outlinePass.visibleEdgeColor.set('#000000');
    outlinePass.hiddenEdgeColor.set('#000000'); // 可见与被遮挡的边同色（也可设置不同色）
    composer.addPass(outlinePass);

    // 4) 交互：点击/悬停高亮
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null;
    let clicked = null;

    function onPointerMove(event){
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      if (!selectable.length) return;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(selectable, true);
      hovered = hits[0]?.object || null;
      updateSelection();
    }

    function onClick(){
      if (!selectable.length) return;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(selectable, true);
      clicked = hits[0]?.object || null;
      updateSelection(true);
    }

    function updateSelection(byClick=false){
      // 逻辑：优先显示 clicked；没有 clicked 时显示 hovered；都没有时显示整模（selectable）
      if (byClick && clicked){
        outlinePass.selectedObjects = [clicked];
      } else if (!clicked && hovered){
        outlinePass.selectedObjects = [hovered];
      } else if (!clicked && !hovered){
        outlinePass.selectedObjects = selectable;
      }
    }

    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('click', onClick);

    // 5) 响应式
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      outlinePass.setSize(w, h);
    });

    // 6) 面板绑定
    const $ = (id)=>document.getElementById(id);
    $('#toggleOutline').addEventListener('change', e=>{
      outlinePass.enabled = e.target.checked;
    });
    $('#color').addEventListener('input', e=>{
      outlinePass.visibleEdgeColor.set(e.target.value);
      outlinePass.hiddenEdgeColor.set(e.target.value);
    });
    $('#thickness').addEventListener('input', e=>{
      outlinePass.edgeThickness = parseFloat(e.target.value);
    });
    $('#strength').addEventListener('input', e=>{
      outlinePass.edgeStrength = parseFloat(e.target.value);
    });
    $('#autorotate').addEventListener('change', e=>{
      controls.autoRotate = e.target.checked;
    });

    // 7) 动画循环
    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      composer.render();
    }
    animate();

    // 视角适配
    function fitCameraToObject(camera, object, controls) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3(); box.getSize(size);
      const center = new THREE.Vector3(); box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraZ = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
      cameraZ *= 1.3; // 余量
      camera.position.set(center.x, center.y + maxDim*0.1, cameraZ);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }
  </script>
</body>
</html>
