<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GLB 交互描边查看器 (Outline + Crease)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;}
    #app{position:fixed;inset:0;}
    .panel{
      position:fixed; top:12px; right:12px; padding:12px; border-radius:12px;
      background:rgba(255,255,255,.92); font:13px/1.4 system-ui,Segoe UI,Roboto;
      box-shadow:0 6px 30px rgba(0,0,0,.08); backdrop-filter:saturate(1.2) blur(8px); z-index:10;
      max-width:300px
    }
    .panel .row{display:flex; align-items:center; gap:8px; margin:6px 0;}
    .panel .row > span{min-width:80px; color:#333}
    .panel input[type="color"]{width:32px;height:20px;border:none;background:none;padding:0}
    .panel input[type="range"]{width:150px}
    .panel select{flex:1}
    .panel .sub{color:#888; margin-top:6px}
    .badge{position:fixed;left:12px;bottom:12px;font:12px system-ui;color:#666}
    .log{position:fixed;left:12px;top:12px;max-width:60vw;background:rgba(0,0,0,.65);color:#fff;
      font:12px/1.4 ui-monospace,monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;z-index:10}
    button{border:1px solid #ddd; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer}
    button:active{transform:translateY(1px)}
  </style>

  <!-- import map：把裸模块名 three 映射到本地 -->
  <script type="importmap">
  { "imports": { "three": "./libs/three-r152/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="app"></div>

  <div class="panel">
    <div class="row"><label><input id="toggleOutline" type="checkbox" checked> 启用轮廓描边</label></div>
    <div class="row"><span>颜色</span><input id="color" type="color" value="#ff0000"></div>
    <div class="row"><span>粗细</span><input id="thickness" type="range" min="1" max="8" step="0.1" value="3"><output id="thicknessOut">3</output></div>
    <div class="row"><span>强度</span><input id="strength" type="range" min="0" max="12" step="0.1" value="6.5"><output id="strengthOut">6.5</output></div>

    <div class="row"><span>描边模式</span>
      <select id="outlineMode">
        <option value="all" selected>全部</option>
        <option value="hover">悬停</option>
        <option value="click">点击</option>
      </select>
    </div>

    <hr>
    <div class="row"><label><input id="toggleCrease" type="checkbox" checked> 显示转折线</label></div>
    <div class="row"><span>角阈值</span><input id="creaseAngle" type="range" min="1" max="90" step="1" value="35"><output id="creaseAngleOut">35°</output></div>

    <hr>
    <div class="row"><span>FOV</span><input id="fov" type="range" min="20" max="90" step="1" value="38"><output id="fovOut">38</output></div>
    <div class="row"><span>视距裕量</span><input id="ratio" type="range" min="1.05" max="2.5" step="0.01" value="1.05"><output id="ratioOut">1.05</output></div>
    <div class="row"><label><input id="autoRange" type="checkbox" checked> 自动相机范围</label></div>
    <div class="row"><span>近裁剪</span><input id="near" type="range" min="0.01" max="50" step="0.01" value="0.1" disabled><output id="nearOut">0.10</output></div>
    <div class="row"><span>远裁剪</span><input id="far" type="range" min="10" max="10000" step="1" value="2000" disabled><output id="farOut">2000</output></div>
    <div class="row"><button id="refit">重新适配视角</button></div>

    <hr>
    <div class="row"><span>背景</span><input id="bg" type="color" value="#000000"></div>
    <div class="row"><span>灯光</span><input id="light" type="range" min="0" max="3" step="0.05" value="1.2"><output id="lightOut">1.2</output></div>
    <div class="row"><label><input id="autorotate" type="checkbox" checked> 自动旋转</label></div>
    <div class="row"><span>自转速度</span><input id="rotateSpeed" type="range" min="0" max="2" step="0.05" value="0.6"><output id="rotateOut">0.6</output></div>
    <div class="row"><label><input id="gridVis" type="checkbox" checked> 显示网格</label></div>
    <div class="row"><span>网格缩放</span><input id="gridScale" type="range" min="0.1" max="5" step="0.05" value="1.1"><output id="gridScaleOut">1.10</output></div>

    <div class="sub">提示：轮廓描边=外轮廓粗线；转折线=几何锐角线（类似 Freestyle）。</div>
  </div>

  <div class="badge">three r152 (ESM) + OutlinePass + Edges</div>
  <div class="log" id="log">日志：</div>

  <script type="module">
    import * as THREE from './libs/three-r152/build/three.module.js';
    import { OrbitControls } from './libs/three-r152/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from './libs/three-r152/examples/jsm/loaders/GLTFLoader.js';
    import { EffectComposer } from './libs/three-r152/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from './libs/three-r152/examples/jsm/postprocessing/RenderPass.js';
    import { OutlinePass } from './libs/three-r152/examples/jsm/postprocessing/OutlinePass.js';

    window.addEventListener('DOMContentLoaded', init);

    function init(){
      const GLB_URL = './stage.glb?v=1';

      // ---------- DOM helpers ----------
      const $ = (id)=>document.getElementById(id);
      const val = (id, fb)=>($(id)?.value ?? fb);
      const chk = (id, fb=false)=>($(id)?.checked ?? fb);
      const setVal = (id,v)=>{ const el=$(id); if(el) el.value=v; };
      const setText= (id,t)=>{ const el=$(id); if(el) el.textContent=t; };
      const on = (id,evt,fn)=>{ const el=$(id); if(el) el.addEventListener(evt,fn); };

      const LOG = $('#log');
      let progressText = '—';
      const log = (...args)=>{
        if (LOG) {
          LOG.textContent = `加载中： ${progressText}\n` + args.join(' ')
            + '\n' + LOG.textContent.split('\n').slice(2).join('\n');
        }
        console.log(...args);
      };

      // ---------- Renderer / Scene / Camera ----------
      const container = document.getElementById('app');
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      if ('outputColorSpace' in renderer) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;  // r153+
      } else if ('outputEncoding' in renderer) {
        renderer.outputEncoding = THREE.sRGBEncoding;      // r152
      }
      if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(val('bg','#000000'));

      const camera = new THREE.PerspectiveCamera(parseFloat(val('fov','38')), window.innerWidth/window.innerHeight, 0.1, 2000);
      camera.position.set(0, 2, 6);

      const light1 = new THREE.DirectionalLight(0xffffff, parseFloat(val('light','1.2')));
      light1.position.set(2, 4, 2);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6), light1);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.autoRotate = chk('autorotate', true);
      controls.autoRotateSpeed = parseFloat(val('rotateSpeed','0.6'));

      // Helpers
      const axes = new THREE.AxesHelper(1.2);
      const grid = new THREE.GridHelper(10, 10, 0x888888, 0x222222);
      grid.position.y = -0.01;
      scene.add(axes, grid);

      // ---------- Postprocessing ----------
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
      outlinePass.edgeStrength = parseFloat(val('strength','6.5'));
      outlinePass.edgeThickness = parseFloat(val('thickness','3'));
      outlinePass.edgeGlow = 0.0; outlinePass.usePatternTexture = false;
      const edgeColor = val('color', '#ff0000');
      outlinePass.visibleEdgeColor.set(edgeColor);
      outlinePass.hiddenEdgeColor.set(edgeColor);
      composer.addPass(outlinePass);

      // ---------- Load GLB ----------
      const loader = new GLTFLoader();
      const selectable = [];
      let root = null;
      let bboxSize = new THREE.Vector3(1,1,1);
      let bboxCenter = new THREE.Vector3(0,0,0);
      let maxDim = 1;

      loader.load(GLB_URL, (gltf) => {
        root = gltf.scene;
        root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; selectable.push(o); } });
        scene.add(root);

        // 材质统计（你的截图里 basic 为主，说明大多是 Unlit/Basic，无贴图）
        const stat = {basic:0,standard:0,physical:0,withMap:0,others:0,total:0};
        root.traverse(o=>{
          const m=o.material; if(o.isMesh && m){ stat.total++;
            if(m.isMeshBasicMaterial) stat.basic++;
            else if(m.isMeshStandardMaterial) stat.standard++;
            else if(m.isMeshPhysicalMaterial) stat.physical++;
            else stat.others++;
            if(m.map) stat.withMap++;
          }
        });
        console.log('🧪 材质统计：', stat);

        // 包围盒 & 初次适配
        const box = new THREE.Box3().setFromObject(root);
        box.getSize(bboxSize); box.getCenter(bboxCenter);
        maxDim = Math.max(bboxSize.x, bboxSize.y, bboxSize.z) || 1;

        refitCamera();
        updateSelection();      // 轮廓描边
        rebuildCreaseLines();   // 转折线
        log('✅ 模型加载完成：', GLB_URL);

      }, (evt) => {
        progressText = evt.total ? `${(evt.loaded/evt.total*100).toFixed(1)}%` : `${evt.loaded} bytes`;
      }, (err) => {
        log('❌ 模型加载失败：', err && (err.message || err));
        const cube = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
        scene.add(cube);
        const box = new THREE.Box3().setFromObject(cube);
        box.getSize(bboxSize); box.getCenter(bboxCenter); maxDim = 1;
        refitCamera();
      });

      // ---------- Hover / Click selection ----------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let hovered=null, clicked=null, outlineMode='all';

      on('outlineMode','change', e=>{ outlineMode = e.target.value; updateSelection(); });
      outlineMode = val('outlineMode','all');

      function onPointerMove(event){
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        if (!selectable.length) return;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(selectable, true);
        hovered = hits[0]?.object || null;
        if (outlineMode==='hover') updateSelection();
      }
      function onClick(){
        if (!selectable.length) return;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(selectable, true);
        clicked = hits[0]?.object || null;
        if (outlineMode==='click') updateSelection(true);
      }
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      renderer.domElement.addEventListener('click', onClick);

      function updateSelection(){
        if (outlineMode==='all') { outlinePass.selectedObjects = selectable; return; }
        if (outlineMode==='click') { outlinePass.selectedObjects = clicked ? [clicked] : []; return; }
        outlinePass.selectedObjects = hovered ? [hovered] : [];
      }

      // ---------- Crease lines（EdgesGeometry） ----------
      let creaseAngle = parseFloat(val('creaseAngle','35')); // 度
      on('toggleCrease','change', e=> setCreaseVisible(e.target.checked));
      on('creaseAngle','input', e=>{
        creaseAngle = parseFloat(e.target.value);
        setText('creaseAngleOut', `${creaseAngle}°`);
        rebuildCreaseLines();
      });
      on('color','input', e=> setCreaseColor(e.target.value));

      function setCreaseVisible(v){
        if (!root) return;
        root.traverse(o=>{
          if (o.userData.__edgeLines) o.userData.__edgeLines.visible = v;
        });
      }
      function setCreaseColor(hex){
        if (!root) return;
        root.traverse(o=>{
          const lines = o.userData.__edgeLines;
          if (lines && lines.material) lines.material.color.set(hex);
        });
      }
      function rebuildCreaseLines(){
        if (!root) return;
        // 清除旧线
        root.traverse(o=>{
          const lines = o.userData.__edgeLines;
          if (lines) { o.remove(lines); lines.geometry.dispose(); lines.material.dispose(); o.userData.__edgeLines=null; }
        });
        // 新建
        const colorHex = val('color','#ff0000');
        root.traverse(o=>{
          if (o.isMesh && o.geometry){
            const eg = new THREE.EdgesGeometry(o.geometry, creaseAngle);
            const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent:true, opacity:1 });
            const lines = new THREE.LineSegments(eg, mat);
            lines.userData.__edge = true;
            o.add(lines);                 // 作为 mesh 的子节点，可自动跟随变换
            o.userData.__edgeLines = lines;
            lines.visible = chk('toggleCrease', true);
          }
        });
      }

      // ---------- Camera fit ----------
      function refitCamera(){
        const fov = camera.fov * Math.PI/180;
        const dist = maxDim / (2 * Math.tan(fov/2));
        const ratio = parseFloat(val('ratio','1.05'));
        const camZ = dist * ratio;

        camera.position.set(bboxCenter.x, bboxCenter.y + maxDim*0.1, camZ);

        if (chk('autoRange', true)) {
          camera.near = Math.max(camZ - maxDim*3, 0.01);
          camera.far  = camZ + maxDim*3;
          setVal('near', camera.near.toFixed(2));
          setVal('far',  camera.far.toFixed(0));
          setText('nearOut', camera.near.toFixed(2));
          setText('farOut',  camera.far.toFixed(0));
        } else {
          const nearEl=$('near'), farEl=$('far');
          camera.near = Math.max(parseFloat(nearEl?.value ?? 0.1), 0.01);
          camera.far  = Math.max(parseFloat(farEl?.value  ?? 2000), camera.near + 1);
        }

        camera.updateProjectionMatrix();
        controls.target.copy(bboxCenter);
        controls.maxDistance = camera.far * 0.9;
        controls.update();

        grid.visible = chk('gridVis', true);
        const s = Math.max(maxDim * parseFloat(val('gridScale','1.1')), 0.001);
        grid.scale.setScalar(s / 10);

        log(`📐 bbox=${bboxSize.toArray().map(n=>n.toFixed(2)).join(',')}  center=${bboxCenter.toArray().map(n=>n.toFixed(2)).join(',')}`,
            ` camZ=${camZ.toFixed(2)}  near/far=${camera.near.toFixed(2)}/${camera.far.toFixed(2)}`);
      }

      // ---------- UI bindings ----------
      on('toggleOutline','change', e=> outlinePass.enabled = e.target.checked);
      on('thickness','input', e=>{ outlinePass.edgeThickness = parseFloat(e.target.value); setText('thicknessOut',e.target.value); });
      on('strength','input', e=>{ outlinePass.edgeStrength  = parseFloat(e.target.value); setText('strengthOut', e.target.value); });

      on('fov','input', e=>{ camera.fov = parseFloat(e.target.value); setText('fovOut',e.target.value); refitCamera(); });
      on('ratio','input', e=>{ setText('ratioOut',e.target.value); refitCamera(); });
      on('autoRange','change', e=>{ const onoff=e.target.checked; const nearEl=$('near'),farEl=$('far'); if(nearEl&&farEl){nearEl.disabled=farEl.disabled=onoff;} refitCamera(); });
      on('near','input', e=>{ setText('nearOut',parseFloat(e.target.value).toFixed(2)); if(!chk('autoRange',true)) refitCamera(); });
      on('far','input',  e=>{ setText('farOut', parseFloat(e.target.value).toFixed(0)); if(!chk('autoRange',true)) refitCamera(); });
      on('refit','click', refitCamera);

      on('bg','input', e=> scene.background = new THREE.Color(e.target.value));
      on('light','input', e=>{ light1.intensity = parseFloat(e.target.value); setText('lightOut',e.target.value); });
      on('autorotate','change', e=> controls.autoRotate = e.target.checked);
      on('rotateSpeed','input', e=>{ controls.autoRotateSpeed = parseFloat(e.target.value); setText('rotateOut',e.target.value); });
      on('gridVis','change', ()=> refitCamera());
      on('gridScale','input', e=>{ setText('gridScaleOut',parseFloat(e.target.value).toFixed(2)); refitCamera(); });

      // ---------- Resize ----------
      window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w/h; camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        composer.setSize(w, h);
        outlinePass.setSize(w, h);
      });

      // ---------- Loop ----------
      function animate(){ requestAnimationFrame(animate); controls.update(); composer.render(); }
      animate();
    }
  </script>
</body>
</html>
